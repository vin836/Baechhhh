<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#1f2937">
  <defs>
    <g id="npn" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="22" stroke-width="4"/>
      <line x1="0" y1="-9" x2="26" y2="-30"/><line x1="26" y1="-30" x2="26" y2="-50"/>
      <line x1="0" y1="9" x2="26" y2="30"/><line x1="26" y1="30" x2="26" y2="50"/>
      <line x1="-40" y1="0" x2="0" y2="0"/>
      <polygon points="23.9,28.3 13.3,25.5 18.9,18.5" fill="#1f2937" stroke="none"/>
    </g>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#dc2626" stroke-width="2"/></pattern>
  </defs>
  <rect width="640" height="430" fill="#ffffff"/>

  <!-- 電路符號 -->
  <use href="#npn" x="110" y="85"/>
  <text x="62" y="90" text-anchor="end" font-weight="700">B</text>
  <text x="62" y="108" text-anchor="end" font-size="13" fill="#6b7280">（共用）</text>
  <text x="146" y="42" font-weight="700">C <tspan fill="#2563eb">（出）</tspan></text>
  <text x="146" y="138" font-weight="700">E <tspan fill="#dc2626">（入）</tspan></text>

  <text x="270" y="40" font-size="20" font-weight="700">共基極 CB</text>
  <text x="270" y="70">輸入在<tspan fill="#dc2626" font-weight="700">射極 E</tspan>，輸出在<tspan fill="#2563eb" font-weight="700">集極 C</tspan></text>
  <text x="270" y="98">輸出特性：IC = αIE + ICBO</text>
  <text x="270" y="126">電流增益：Ai = α ≈ 1</text>

  <line x1="20" y1="160" x2="620" y2="160" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- (1) 輸入特性曲線 -->
  <text x="40" y="186" font-weight="700">(1) 輸入特性曲線</text>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <line x1="70" y1="395" x2="300" y2="395" marker-end="url(#ax)"/>
    <line x1="70" y1="395" x2="70" y2="205" marker-end="url(#ax)"/>
  </g>
  <line x1="192" y1="395" x2="192" y2="330" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M70,393 L165,391 C185,386 193,330 207,215" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="80" y="214" font-weight="700">IE</text>
  <text x="300" y="418" text-anchor="end" font-weight="700">VBE</text>
  <text x="192" y="418" text-anchor="middle" font-size="13">0.7V</text>
  <text x="216" y="240" font-size="13" fill="#2563eb">VCB</text>

  <!-- (2) 輸出特性曲線 -->
  <text x="340" y="186" font-weight="700">(2) 輸出特性曲線</text>
  <rect x="360" y="205" width="60" height="190" fill="#dbeafe"/>
  <text x="390" y="290" text-anchor="middle" font-size="13" fill="#1d4ed8">飽</text>
  <text x="390" y="308" text-anchor="middle" font-size="13" fill="#1d4ed8">和</text>
  <text x="390" y="326" text-anchor="middle" font-size="13" fill="#1d4ed8">區</text>
  <rect x="420" y="383" width="180" height="12" fill="url(#hatch)"/>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <line x1="360" y1="395" x2="620" y2="395" marker-end="url(#ax)"/>
    <line x1="420" y1="395" x2="420" y2="205" marker-end="url(#ax)"/>
  </g>
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M398,395 C408,395 412,345 424,345 L585,342"/>
    <path d="M396,395 C406,395 411,300 424,300 L585,297"/>
    <path d="M394,395 C404,395 410,258 424,258 L585,255"/>
    <path d="M392,395 C402,395 409,218 424,218 L585,215"/>
  </g>
  <line x1="603" y1="345" x2="603" y2="225" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="603" y="216" text-anchor="middle" font-size="13" fill="#2563eb">IE↑</text>
  <text x="430" y="214" font-weight="700">IC</text>
  <text x="620" y="418" text-anchor="end" font-weight="700">VCB</text>
  <text x="502" y="325" text-anchor="middle" fill="#1f2937" font-weight="700">工作區</text>
  <text x="580" y="375" text-anchor="end" font-size="13" fill="#dc2626" font-weight="700">截止區（IE = 0）</text>
</svg>
