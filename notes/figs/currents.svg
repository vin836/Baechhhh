<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="16" fill="#1f2937">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="220" fill="#ffffff"/>
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <line x1="80" y1="80" x2="260" y2="80"/>
    <line x1="380" y1="80" x2="560" y2="80"/>
    <rect x="260" y="50" width="120" height="60" rx="8" fill="#f3f4f6"/>
    <line x1="320" y1="110" x2="320" y2="175"/>
  </g>
  <text x="320" y="86" text-anchor="middle" font-weight="700">BJT</text>
  <text x="70" y="86" text-anchor="end" font-weight="700">E</text>
  <text x="570" y="86" font-weight="700">C</text>
  <text x="320" y="196" text-anchor="middle" font-weight="700">B</text>

  <g stroke="#dc2626" stroke-width="2.5">
    <line x1="200" y1="62" x2="120" y2="62" marker-end="url(#ar)"/>
    <line x1="520" y1="62" x2="440" y2="62" marker-end="url(#ar)"/>
    <line x1="340" y1="170" x2="340" y2="125" marker-end="url(#ar)"/>
  </g>
  <text x="160" y="50" text-anchor="middle" fill="#dc2626" font-weight="700">IE（流出）</text>
  <text x="480" y="50" text-anchor="middle" fill="#dc2626" font-weight="700">IC（流入）</text>
  <text x="352" y="155" fill="#dc2626" font-weight="700">IB（流入）</text>

  <text x="40" y="150" font-size="15">IE = IB + IC</text>
  <text x="40" y="174" font-size="15">IE &gt; IC &gt;&gt; IB</text>
  <text x="600" y="150" font-size="13" fill="#6b7280" text-anchor="end">以 NPN 為例</text>
</svg>
