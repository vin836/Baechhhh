<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#1f2937">
  <rect width="640" height="230" fill="#ffffff"/>
  <!-- PNP -->
  <text x="160" y="32" text-anchor="middle" font-size="18" font-weight="700">PNP</text>
  <g stroke="#1f2937" stroke-width="2">
    <rect x="70" y="60" width="75" height="60" fill="#dbeafe"/>
    <rect x="145" y="60" width="22" height="60" fill="#fde2e1"/>
    <rect x="167" y="60" width="113" height="60" fill="#dbeafe"/>
    <line x1="30" y1="90" x2="70" y2="90"/>
    <line x1="280" y1="90" x2="310" y2="90"/>
    <line x1="156" y1="120" x2="156" y2="160"/>
  </g>
  <text x="107" y="96" text-anchor="middle" font-weight="700">P⁺</text>
  <text x="156" y="96" text-anchor="middle" font-weight="700">N</text>
  <text x="223" y="96" text-anchor="middle" font-weight="700">P</text>
  <text x="30" y="80" text-anchor="start">E</text>
  <text x="30" y="118" font-size="13" fill="#6b7280">射極</text>
  <text x="310" y="80" text-anchor="end">C</text>
  <text x="310" y="118" font-size="13" fill="#6b7280" text-anchor="end">集極</text>
  <text x="156" y="180" text-anchor="middle">B（基極）</text>

  <!-- NPN -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700">NPN</text>
  <g stroke="#1f2937" stroke-width="2">
    <rect x="390" y="60" width="75" height="60" fill="#fde2e1"/>
    <rect x="465" y="60" width="22" height="60" fill="#dbeafe"/>
    <rect x="487" y="60" width="113" height="60" fill="#fde2e1"/>
    <line x1="350" y1="90" x2="390" y2="90"/>
    <line x1="600" y1="90" x2="630" y2="90"/>
    <line x1="476" y1="120" x2="476" y2="160"/>
  </g>
  <text x="427" y="96" text-anchor="middle" font-weight="700">N⁺</text>
  <text x="476" y="96" text-anchor="middle" font-weight="700">P</text>
  <text x="543" y="96" text-anchor="middle" font-weight="700">N</text>
  <text x="350" y="80">E</text>
  <text x="350" y="118" font-size="13" fill="#6b7280">射極</text>
  <text x="630" y="80" text-anchor="end">C</text>
  <text x="630" y="118" font-size="13" fill="#6b7280" text-anchor="end">集極</text>
  <text x="476" y="180" text-anchor="middle">B（基極）</text>

  <text x="320" y="214" text-anchor="middle" font-size="13" fill="#6b7280">濃度 E &gt; B &gt; C　｜　寬度 C &gt; E &gt;&gt; B（B 最窄）</text>
</svg>
