<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="刷題本">
  <title>刷題本｜測驗題庫</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="回題庫">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>刷題本</span>
    </button>
  </header>

  <input type="file" id="importFile" accept=".txt,.md,.json,text/plain" multiple hidden>
  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" aria-label="主選單">
    <button data-nav="home"><span class="ico">📚</span>題庫</button>
    <button data-nav="wrong"><span class="ico">📕</span>錯題本<b class="badge" id="wrongBadge" hidden></b></button>
    <button data-nav="stats"><span class="ico">📈</span>統計</button>
  </nav>

  <script src="banks.js"></script>
  <script src="app.js"></script>
  <script src="./ai.js"></script>
  <script src="./share.js"></script>
</body>
</html>
